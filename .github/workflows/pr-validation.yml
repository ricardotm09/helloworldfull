name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  terraform-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Conftest (official binary + checksum)
        shell: bash
        run: |
          set -euo pipefail
          CONFTEST_VERSION="0.56.0"
          CONFTEST_TARBALL="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          CONFTEST_SHA256="620f41640d63bbde1646a108ce2816ba54c980466ceebb7e754dda2d508e8cd5"

          curl -fsSLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${CONFTEST_TARBALL}"
          echo "${CONFTEST_SHA256}  ${CONFTEST_TARBALL}" | sha256sum -c -

          tar -xzf "${CONFTEST_TARBALL}" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest

      - name: Kubernetes policy check (Conftest)
        run: |
          conftest test k8s/deployment.yaml --policy policy/kubernetes --namespace main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.8.5

      - name: Terraform format check
        working-directory: terraform/environments/dev
        run: |
          terraform fmt -check

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: |
          terraform validate

      - name: Terraform security scan (tfsec)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: terraform/environments/dev
          additional_args: --minimum-severity HIGH --format sarif --out tfsec.sarif

      - name: Upload tfsec scan results to GitHub Security
        if: ${{ always() && hashFiles('terraform/environments/dev/tfsec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: terraform/environments/dev/tfsec.sarif

      - name: Dependency vulnerability scan (Trivy filesystem)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: library
          format: sarif
          output: trivy-deps.sarif
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload dependency scan results to GitHub Security
        if: ${{ always() && hashFiles('trivy-deps.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: trivy-deps.sarif

