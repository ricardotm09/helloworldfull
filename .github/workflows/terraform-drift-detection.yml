name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Azure auth inputs
        run: |
          if [ -z "${{ env.AZURE_CLIENT_ID }}" ] || [ -z "${{ env.AZURE_TENANT_ID }}" ] || [ -z "${{ env.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::Missing AZURE_CLIENT_ID, AZURE_TENANT_ID, or AZURE_SUBSCRIPTION_ID. Set them in Repository Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -reconfigure

      - name: Terraform drift plan
        id: drift_plan
        shell: bash
        working-directory: terraform/environments/dev
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan > tfplan.log 2>&1
          exit_code=$?
          set -e

          case "$exit_code" in
            0)
              plan_line="$(grep -E '^Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.$' tfplan.log | tail -n 1 || true)"
              if [ -n "$plan_line" ]; then
                add_count="$(echo "$plan_line" | awk '{print $2}')"
                change_count="$(echo "$plan_line" | awk '{print $5}')"
                destroy_count="$(echo "$plan_line" | awk '{print $8}')"

                if [ "$add_count" -gt 0 ] || [ "$change_count" -gt 0 ] || [ "$destroy_count" -gt 0 ]; then
                  terraform show -no-color tfplan > tfplan.txt
                  echo "drift_detected=true" >> "$GITHUB_OUTPUT"
                  echo "DRIFT_STATUS=detected_from_plan" >> "$GITHUB_ENV"
                  echo "::error::Actionable Terraform plan detected despite exit code 0: $plan_line"
                  {
                    echo "## Terraform Drift Check"
                    echo "DRIFT_STATUS=detected_from_plan"
                    echo "$plan_line"
                    echo "See artifact: terraform-drift-dev"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 2
                fi
              fi

              if grep -Fq "Objects have changed outside of Terraform" tfplan.log; then
                echo "drift_detected=true" >> "$GITHUB_OUTPUT"
                echo "DRIFT_STATUS=external_changes" >> "$GITHUB_ENV"
                echo "::error::External changes detected in tfplan.log despite exit code 0."
                {
                  echo "## Terraform Drift Check"
                  echo "DRIFT_STATUS=external_changes"
                  echo "Detected note: Objects have changed outside of Terraform"
                  echo "See artifact: terraform-drift-dev"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 2
              fi

              echo "drift_detected=false" >> "$GITHUB_OUTPUT"
              echo "DRIFT_STATUS=clean" >> "$GITHUB_ENV"
              echo "No drift detected."
              {
                echo "## Terraform Drift Check"
                echo "DRIFT_STATUS=clean"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              terraform show -no-color tfplan > tfplan.txt
              echo "drift_detected=true" >> "$GITHUB_OUTPUT"
              echo "DRIFT_STATUS=detected" >> "$GITHUB_ENV"
              echo "::error::Drift detected."
              {
                echo "## Terraform Drift Check"
                echo "DRIFT_STATUS=detected"
                echo "See artifact: terraform-drift-dev"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 2
              ;;
            *)
              echo "DRIFT_STATUS=error" >> "$GITHUB_ENV"
              echo "::error::terraform plan failed with exit code $exit_code"
              cat tfplan.log
              {
                echo "## Terraform Drift Check"
                echo "DRIFT_STATUS=error"
                echo "terraform plan failed with exit code $exit_code"
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$exit_code"
              ;;
          esac

      - name: Upload drift plan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-drift-dev
          path: |
            terraform/environments/dev/tfplan.log
            terraform/environments/dev/tfplan.txt

