name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aks-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  K8S_NAMESPACE: default
  IMAGE_REPOSITORY: click-counter
  IMAGE_TAG: ${{ github.sha }}

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Azure auth inputs
        run: |
          if [ -z "${{ env.AZURE_CLIENT_ID }}" ] || [ -z "${{ env.AZURE_TENANT_ID }}" ] || [ -z "${{ env.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::Missing AZURE_CLIENT_ID, AZURE_TENANT_ID, or AZURE_SUBSCRIPTION_ID. Set them in Repository Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -reconfigure

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan -out=tfplan

      - name: Export Terraform plan (human-readable)
        working-directory: terraform/environments/dev
        run: |
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-dev
          path: |
            terraform/environments/dev/tfplan
            terraform/environments/dev/tfplan.txt

  deploy:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.8.5

      - name: Download Terraform plan artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-dev
          path: terraform/environments/dev

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -reconfigure

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: |
          terraform apply -auto-approve tfplan

      - name: Get deployment targets
        working-directory: terraform/environments/dev
        id: deploy_targets
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "aks_name=$(terraform output -raw aks_name)" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "${{ steps.deploy_targets.outputs.acr_name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.deploy_targets.outputs.acr_login_server }}/click-counter:${{ env.IMAGE_TAG }}

      - name: Build immutable image reference
        id: image_ref
        run: |
          digest="${{ steps.build_image.outputs.digest }}"
          if [ -z "$digest" ] || ! echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Docker build did not return a valid image digest."
            exit 1
          fi

          image_name="${{ steps.deploy_targets.outputs.acr_login_server }}/click-counter@$digest"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM for image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image_ref.outputs.image_name }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-dev
          path: sbom.cdx.json

      - name: Scan container image (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image_ref.outputs.image_name }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Set up Cosign (official binary + checksum)
        shell: bash
        run: |
          set -euo pipefail
          COSIGN_VERSION="3.1.2"
          COSIGN_BINARY="cosign-linux-amd64"
          COSIGN_SHA256="f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf"

          curl -fsSLO "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/${COSIGN_BINARY}"
          echo "${COSIGN_SHA256}  ${COSIGN_BINARY}" | sha256sum -c -

          chmod +x "${COSIGN_BINARY}"
          sudo install -m 0755 "${COSIGN_BINARY}" /usr/local/bin/cosign

      - name: Sign image digest (Cosign keyless)
        run: |
          cosign sign --yes "${{ steps.image_ref.outputs.image_name }}"

      - name: Verify image signature (Cosign keyless)
        run: |
          expected_identity="https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main"

          cosign verify \
            --certificate-identity "$expected_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image_ref.outputs.image_name }}"

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group "${{ steps.deploy_targets.outputs.resource_group_name }}" --name "${{ steps.deploy_targets.outputs.aks_name }}" --overwrite-existing

      - name: Ensure Kyverno admission controller
        shell: bash
        run: |
          set -euo pipefail
          KYVERNO_VERSION="v1.15.2"

          if kubectl get deployment kyverno-admission-controller -n kyverno >/dev/null 2>&1; then
            echo "Kyverno already installed."
          else
            kubectl apply -f "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml"
          fi

          kubectl rollout status deployment/kyverno-admission-controller -n kyverno --timeout=180s

      - name: Apply cluster signature policy (Kyverno)
        env:
          IMAGE_REPO: ${{ steps.deploy_targets.outputs.acr_login_server }}/click-counter
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
        run: |
          envsubst < k8s/policies/kyverno-verify-main-signer.yaml | kubectl apply -f -

      - name: Deploy to AKS
        run: |
          if ! echo "${{ steps.image_ref.outputs.image_name }}" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
            echo "::error::Refusing deployment because image is not digest-pinned."
            exit 1
          fi

          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/click-counter -n "${{ env.K8S_NAMESPACE }}" --timeout=180s
        env:
          IMAGE_NAME: ${{ steps.image_ref.outputs.image_name }}

      - name: Resolve service endpoint
        id: service_endpoint
        run: |
          for attempt in $(seq 1 20); do
            service_ip=$(kubectl get svc click-counter -n "${{ env.K8S_NAMESPACE }}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            service_hostname=$(kubectl get svc click-counter -n "${{ env.K8S_NAMESPACE }}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$service_ip" ]; then
              echo "url=http://$service_ip" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ -n "$service_hostname" ]; then
              echo "url=http://$service_hostname" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Waiting for LoadBalancer endpoint... attempt $attempt/20"
            sleep 15
          done

          echo "::error::Timed out waiting for the AKS service external endpoint."
          exit 1

      - name: Smoke test deployment
        run: |
          curl --fail --silent --show-error "${{ steps.service_endpoint.outputs.url }}/health/ready"
