name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aks-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  K8S_NAMESPACE: default
  IMAGE_REPOSITORY: click-counter
  IMAGE_TAG: ${{ github.sha }}

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Azure auth inputs
        run: |
          if [ -z "${{ env.AZURE_CLIENT_ID }}" ] || [ -z "${{ env.AZURE_TENANT_ID }}" ] || [ -z "${{ env.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::Missing AZURE_CLIENT_ID, AZURE_TENANT_ID, or AZURE_SUBSCRIPTION_ID. Set them in Repository Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -reconfigure

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan -out=tfplan

      - name: Export Terraform plan (human-readable)
        working-directory: terraform/environments/dev
        run: |
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-dev
          path: |
            terraform/environments/dev/tfplan
            terraform/environments/dev/tfplan.txt

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    # -------------------------------------------------------------
    # MANUAL APPROVAL GATE FOR TERRAFORM APPLY
    # -------------------------------------------------------------
    # environment:
    #   name: tf-infra
    outputs:
      acr_name: ${{ steps.deploy_targets.outputs.acr_name }}
      acr_login_server: ${{ steps.deploy_targets.outputs.acr_login_server }}
      resource_group_name: ${{ steps.deploy_targets.outputs.resource_group_name }}
      aks_name: ${{ steps.deploy_targets.outputs.aks_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.8.5

      - name: Download Terraform plan artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-dev
          path: terraform/environments/dev

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -reconfigure

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: |
          terraform apply -auto-approve tfplan

      - name: Get deployment targets
        working-directory: terraform/environments/dev
        id: deploy_targets
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "aks_name=$(terraform output -raw aks_name)" >> "$GITHUB_OUTPUT"

  build-and-sign:
    runs-on: ubuntu-latest
    needs: terraform-apply
    outputs:
      image_name: ${{ steps.image_ref.outputs.image_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "${{ needs.terraform-apply.outputs.acr_name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ needs.terraform-apply.outputs.acr_login_server }}/click-counter:${{ env.IMAGE_TAG }}

      - name: Build immutable image reference
        id: image_ref
        run: |
          digest="${{ steps.build_image.outputs.digest }}"
          if [ -z "$digest" ] || ! echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Docker build did not return a valid image digest."
            exit 1
          fi

          image_name="${{ needs.terraform-apply.outputs.acr_login_server }}/click-counter@$digest"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Publish promoted image reference artifact
        run: |
          mkdir -p release
          echo "${{ steps.image_ref.outputs.image_name }}" > release/image-name.txt

      - name: Upload image reference artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-release
          path: release/image-name.txt

      - name: Generate SBOM for image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image_ref.outputs.image_name }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-main
          path: sbom.cdx.json

      - name: Scan container image (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image_ref.outputs.image_name }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest (Cosign keyless)
        run: |
          cosign sign --yes "${{ steps.image_ref.outputs.image_name }}"

      - name: Verify image signature (Cosign keyless)
        run: |
          expected_identity="https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main"

          cosign verify \
            --certificate-identity "$expected_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image_ref.outputs.image_name }}"

  kyverno-bootstrap:
    needs: terraform-apply
    uses: ./.github/workflows/kyverno-bootstrap.yml
    with:
      acr_login_server: ${{ needs.terraform-apply.outputs.acr_login_server }}
      resource_group_name: ${{ needs.terraform-apply.outputs.resource_group_name }}
      aks_name: ${{ needs.terraform-apply.outputs.aks_name }}

  deploy-dev:
    needs: [terraform-apply, build-and-sign, kyverno-bootstrap]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: dev
      k8s_namespace: dev
      resource_group_name: ${{ needs.terraform-apply.outputs.resource_group_name }}
      aks_name: ${{ needs.terraform-apply.outputs.aks_name }}
      acr_login_server: ${{ needs.terraform-apply.outputs.acr_login_server }}
      image_name: ${{ needs.build-and-sign.outputs.image_name }}

  deploy-stage:
    needs: [terraform-apply, build-and-sign, deploy-dev]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: stage
      k8s_namespace: stage
      resource_group_name: ${{ needs.terraform-apply.outputs.resource_group_name }}
      aks_name: ${{ needs.terraform-apply.outputs.aks_name }}
      acr_login_server: ${{ needs.terraform-apply.outputs.acr_login_server }}
      image_name: ${{ needs.build-and-sign.outputs.image_name }}

  deploy-prod:
    needs: [terraform-apply, build-and-sign, deploy-stage]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: prod
      k8s_namespace: prod
      resource_group_name: ${{ needs.terraform-apply.outputs.resource_group_name }}
      aks_name: ${{ needs.terraform-apply.outputs.aks_name }}
      acr_login_server: ${{ needs.terraform-apply.outputs.acr_login_server }}
      image_name: ${{ needs.build-and-sign.outputs.image_name }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [terraform-plan, terraform-apply, build-and-sign, kyverno-bootstrap, deploy-dev, deploy-stage, deploy-prod]
    if: failure()

    steps:
      - name: Send failure notification
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFICATION_WEBHOOK_URL" ]; then
            echo "No NOTIFICATION_WEBHOOK_URL configured; skipping notification."
            exit 0
          fi

          payload=$(python3 -c "import json, os; print(json.dumps({'text': f\"AKS deploy pipeline failed for repository '${{ github.repository }}'. Review run: {os.environ['RUN_URL']}\"}))")

          curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$NOTIFICATION_WEBHOOK_URL"
